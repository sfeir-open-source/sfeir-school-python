[project]
name = "sfeir-school-python"
version = "2026.12.0"
description = "Ateliers Python SFEIR School : FastAPI, SQLModel et MCP"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.160",
    "sqlmodel>=0.0.24",
    "fastmcp>=4.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.17",
    "httpx>=0.28",
]

[tool.uv]
# Projet d'apprentissage : pas de paquet installable à construire.
package = false

[tool.pytest.ini_options]
# Plusieurs dossiers d'étapes contiennent des fichiers homonymes (main.py, test_main.py) :
# le mode "importlib" évite les conflits entre modules.
addopts = "--import-mode=importlib"
testpaths = ["steps"]

[tool.ruff]
line-length = 100
# Les slides (docs/) contiennent des extraits de code alignés à la main : ruff ne doit pas les reformater.
extend-exclude = ["docs"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Les énoncés step-01 à step-03 contiennent volontairement des trous « ___ » : noms non définis,
# expressions, variables et imports qui paraissent inutiles tant que les trous ne sont pas remplis.
"steps/step-0[123]/main.py" = ["F821", "F841", "B007", "B018", "F401"]
# Les énoncés FastAPI importent ce que les TODO utiliseront.
"steps/fastapi/step-0[12]/main.py" = ["F401", "F841"]
# L'énoncé du lab MCP contient des trous « ___ » et des imports pas encore utilisés.
"steps/mcp/step-01/server.py" = ["F821", "F841", "F401"]
